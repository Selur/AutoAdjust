[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15']

[project]
name = 'vapoursynth-autoadjust'
dynamic = ['version']
description = 'AutoAdjust automatic levels/gamma/saturation/white-balance correction for VapourSynth and AviSynth+ (clean-room port)'
readme = 'README.md'
license = {text = 'GPL-2.0-or-later'}
requires-python = '>=3.8'
dependencies = ['VapourSynth']

[tool.meson-python.args]
setup = ['-Dpython_package=true']

[tool.meson-python.wheel]
exclude = ['*/*.dll.a', '*/*.lib', '*/*.a']
